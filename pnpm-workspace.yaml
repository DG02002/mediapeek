packages:
  - apps/*
  - packages/*

allowBuilds:
  esbuild: true
  msw: true
  sharp: true
  workerd: true

blockExoticSubdeps: true

catalog:
  "@cloudflare/workers-types": 5.20261114.1
  "@oxlint/plugins": 1.93.0
  effect: ^4.1.4
  evlog: 2.35.1
  husky: 9.1.7
  knip: ^6.45.1
  lint-staged: 17.6.0
  markdownlint-cli2: ^0.24.1
  oxfmt: ^0.78.0
  oxlint: 1.93.0
  oxlint-tsgolint: 7.0.2007
  tsx: ^4.23.15
  typescript: 7.0.2
  vite: 8.3.8
  vitest: 5.1.0
  wrangler: 4.162.0

minimumReleaseAge: 10080

minimumReleaseAgeIgnoreMissingTime: false

minimumReleaseAgeStrict: true

saveWorkspaceProtocol: rolling

sharedWorkspaceLockfile: true

strictDepBuilds: true

trustPolicy: no-downgrade

trustPolicyIgnoreAfter: 10080
