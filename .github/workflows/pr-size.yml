name: PR size

on:
  pull_request_target: # zizmor: ignore[dangerous-triggers] Required to label fork PRs; this workflow never checks out or executes PR code.
    branches:
      - main
    types: [opened, reopened, synchronize, ready_for_review, converted_to_draft]

permissions:
  contents: read

jobs:
  sync-labels:
    name: Sync PR size labels
    uses: $/.github/workflows/sync-managed-labels.yml
    with:
      prefix: "size:"
    permissions:
      contents: read
      issues: write

  label:
    name: Label PR size
    needs: sync-labels
    permissions:
      contents: read
      issues: write
      pull-requests: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: pr-size-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    steps:
      - name: Check out trusted workflow source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          sparse-checkout: .github/actions/sync-issue-labels
          sparse-checkout-cone-mode: false
      - name: Calculate PR size label
        id: size
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const labelFile = await github.rest.repos.getContent({
              owner: context.repo.owner,
              repo: context.repo.repo,
              path: ".github/labels.json",
              ref: context.payload.repository.default_branch,
            });

            if (Array.isArray(labelFile.data) || labelFile.data.type !== "file") {
              throw new Error(".github/labels.json must be a file");
            }

            const allLabels = JSON.parse(
              Buffer.from(labelFile.data.content, "base64").toString("utf8"),
            );
            const managedLabels = allLabels.filter((label) => label.name.startsWith("size:"));
            const managedLabelNames = new Set(managedLabels.map((label) => label.name));
            const pullRequestNumber = context.payload.pull_request.number;
            const changedFiles = await github.paginate(github.rest.pulls.listFiles, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pullRequestNumber,
              per_page: 100,
            });
            const changedLines = changedFiles.reduce(
              (total, file) => total + (Number(file.additions) || 0) + (Number(file.deletions) || 0),
              0,
            );
            const sizeBands = managedLabels
              .filter((label) => Number.isInteger(label.maximumChangedLines))
              .sort((leftLabel, rightLabel) =>
                leftLabel.maximumChangedLines - rightLabel.maximumChangedLines,
              );
            const largestSizeLabel = managedLabels.find(
              (label) => !Number.isInteger(label.maximumChangedLines),
            );
            const nextLabelName =
              sizeBands.find((sizeBand) => changedLines <= sizeBand.maximumChangedLines)?.name ??
              largestSizeLabel?.name;

            if (!nextLabelName || !managedLabelNames.has(nextLabelName)) {
              throw new Error(`Missing managed label definition: ${nextLabelName}`);
            }

            core.setOutput("managed-labels", JSON.stringify([...managedLabelNames]));
            core.setOutput(
              "targets",
              JSON.stringify([{ issueNumber: pullRequestNumber, labelName: nextLabelName }]),
            );
            core.info(`PR #${pullRequestNumber}: ${changedLines} changed lines -> ${nextLabelName}`);
      - name: Apply PR size label
        uses: ./.github/actions/sync-issue-labels
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          managed-labels: ${{ steps.size.outputs.managed-labels }}
          targets: ${{ steps.size.outputs.targets }}
